<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Metadata -->
    <meta name="description" content="We build websites and apps for businesses that mean it">
    <meta name="author" content="Codexael">
    <meta name="theme-color" content="#0a0a0a">

    <!-- Open Graph -->
    <meta property="og:title" content="Codexael Finds — Coming Soon">
    <meta property="og:description" content="We build websites and apps for businesses that mean it">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/images/codexael_icon.svg">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Codexael Finds — Coming Soon">
    <meta name="twitter:description" content="We build websites and apps for businesses that mean it">
    <meta name="twitter:image" content="assets/images/codexael_icon.svg">

    <!-- Favicon / App Icon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/codexael_icon.svg">
    <link rel="apple-touch-icon" href="assets/images/codexael_icon.svg">

    <title>Codexael — Coming Soon</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Custom cursor -->
    <div class="cursor" id="cursor"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <!-- Atmosphere layers -->
    <div class="grid-overlay"></div>
    <div class="noise"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Page -->
    <div class="page-wrap">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="logo-wrap">
                <div class="logo-mark">Codex<span>ael</span></div>
            </div>
            <div class="top-bar-right">
                <div class="status-pill">
                    <span class="status-dot"></span>
                    Building in progress
                </div>
            </div>
        </header>

        <!-- Hero -->
        <main class="hero">
            <p class="eyebrow">// 001 — New Studio Experience</p>

            <h1 class="hero-headline">
                Coming<br>
                <span class="accent-line">Soon.</span>
            </h1>

            <p class="hero-sub">
                Smart Software. Simple Solutions.
            </p>

            <!-- Info Grid -->
            <div class="info-grid">
                <div class="info-cell">
                    <p class="info-label">Studio</p>
                    <p class="info-value">Codexael</p>
                </div>
                <div class="info-cell">
                    <p class="info-label">Status</p>
                    <p class="info-value">Under Development</p>
                </div>
                <div class="cta-cell">
                    <a href="mailto:contact@codexael.com" class="cta-btn">
                        Get in Touch <span class="cta-arrow">→</span>
                    </a>
                </div>
            </div>
        </main>

        <!-- Marquee -->
        <div class="marquee-wrap" aria-hidden="true">
            <div class="marquee-track" id="marqueeTrack"></div>
        </div>

        <!-- Bottom Bar -->
        <footer class="bottom-bar">
            <span class="copyright">© 2025 Codexael. All rights reserved.</span>
            <span class="tagline">Designed by people who care about design.</span>
            <nav class="social-links">
                <a href="mailto:contact@codexael.com" class="social-link">Email</a>
            </nav>
        </footer>
    </div>
    <!-- /page-wrap -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App logic -->
    <script src="script.js"></script>
</body>

</html>
